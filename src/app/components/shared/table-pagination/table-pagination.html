<div class="pagination-bar">
  <div class="pagination-info">
    <span>
      Mostrando {{ startIndex() }}-{{ endIndex() }} de {{ totalItems() }}
      @if (totalUnfiltered() !== null && totalUnfiltered() !== totalItems()) {
        (filtrados de {{ totalUnfiltered() }})
      }
      registros
    </span>
  </div>

  <div class="pagination-controls">
    <label for="pageSizeSelect">Filas:</label>
    <select id="pageSizeSelect" [value]="pageSize()" (change)="onPageSizeChange($event)">
      @for (opt of pageSizeOptions(); track opt) {
        <option [value]="opt" [selected]="opt === pageSize()">{{ opt }}</option>
      }
    </select>

    <button
      type="button"
      class="btn-secondary"
      [disabled]="safePage() <= 1"
      (click)="goToPage(safePage() - 1)"
    >
      Anterior
    </button>

    <span>Página {{ safePage() }} de {{ totalPages() }}</span>

    <button
      type="button"
      class="btn-secondary"
      [disabled]="safePage() >= totalPages()"
      (click)="goToPage(safePage() + 1)"
    >
      Siguiente
    </button>
  </div>
</div>
